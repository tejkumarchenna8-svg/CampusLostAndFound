# Activate with SPRING_PROFILES_ACTIVE=prod. Values are required from the deployment environment.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# Require a secret admin password in production; there is deliberately no default.
spring.security.user.name=${CAMPUS_ADMIN_USERNAME:campus-admin}
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD}
spring.security.user.roles=ADMIN