spring.application.name=campus-lost-found-web
spring.datasource.url=jdbc:h2:file:./data/campus-lost-found;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
# Set SPRING_SECURITY_USER_PASSWORD in the environment to choose an admin password. Otherwise Spring generates one at startup and prints it in the application log.
spring.security.user.name=${CAMPUS_ADMIN_USERNAME:campus-admin}
spring.security.user.roles=ADMIN
